apiVersion: v1
kind: ReplicaSet
metadata:
  name: nginx-replicaset
  labels: 
      project: roboshop
      purpose: rs-demo
      tier: frontend
      component: frontend
spec:
  replicas: 2
  selector:
    matchLabels:
      project: roboshop
      purpose: rs-demo
      tier: frontend
      component: frontend
  template:
    metadata:
      labels:
        project: roboshop
        purpose: rs-demo
        tier: frontend
        component: frontend
    spec:
      containers:
      - name: nginx
        image: nginx:stable-alpine3.23-perl
        